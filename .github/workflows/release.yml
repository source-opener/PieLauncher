name: Release

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if this version was released already'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the channel
        id: channel
        run: |
          set -euo pipefail
          if [ '${{ github.ref_name }}' = 'dev' ]; then
            {
              echo "name=beta"
              echo "variant=Beta"
              echo "dir=beta"
              echo "label=Pie Launcher Beta"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "name=stable"
              echo "variant=Release"
              echo "dir=release"
              echo "label=Pie Launcher"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          base=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$base" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          if [ '${{ steps.channel.outputs.name }}' = 'beta' ]; then
            name="$base-beta.${{ github.run_number }}"
          else
            name="$base"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "Building ${{ steps.channel.outputs.name }} version $name"

      - name: Decide whether to publish
        id: check
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          if [ '${{ github.event.inputs.force }}' = 'true' ]; then
            echo "Forced run, publishing $tag regardless of its current state."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag exists already, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signing secrets are configured
        if: steps.check.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value=${!secret}
            [ -n "$value" ] || missing="$missing $secret"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing - see docs/RELEASING.md"
            exit 1
          fi

      - name: Set up JDK 21
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.check.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: steps.check.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"

      - name: Build APK
        if: steps.check.outputs.publish == 'true'
        env:
          ANDROID_KEYFILE: ${{ runner.temp }}/signing/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_BETA_NUMBER: ${{ steps.channel.outputs.name == 'beta' && github.run_number || '' }}
        run: ./gradlew --no-daemon lintDebug assemble${{ steps.channel.outputs.variant }}

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Collect artifacts
        if: steps.check.outputs.publish == 'true'
        id: artifacts
        run: |
          set -euo pipefail
          dir='app/build/outputs/apk/${{ steps.channel.outputs.dir }}'
          apk=$(find "$dir" -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No APK was built in $dir"
            exit 1
          fi
          mkdir -p dist
          if [ '${{ steps.channel.outputs.name }}' = 'beta' ]; then
            name="PieLauncher-Beta-${{ steps.version.outputs.tag }}.apk"
          else
            name="PieLauncher-${{ steps.version.outputs.tag }}.apk"
          fi
          cp "$apk" "dist/$name"
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          echo "apk=dist/$name" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$name.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        if: steps.check.outputs.publish == 'true'
        id: signature
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs --verbose '${{ steps.artifacts.outputs.apk }}'
          fingerprint=$("$apksigner" verify --print-certs '${{ steps.artifacts.outputs.apk }}' |
            sed -n 's/.*SHA-256 digest: *//p' | head -n 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Assemble release notes
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if [ '${{ steps.channel.outputs.name }}' = 'beta' ]; then
            previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$previous" ]; then
              changes=$(git log --no-merges --format='* %s' "$previous"..HEAD)
            else
              changes=$(git log --no-merges --format='* %s' -n 20)
            fi
            [ -n "$changes" ] || changes="No changes since $previous."
          else
            changes=$(awk -v v='## ${{ steps.version.outputs.base }}' '
              $0 == v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
            [ -n "$changes" ] || changes="See CHANGELOG.md for details."
          fi
          {
            if [ '${{ steps.channel.outputs.name }}' = 'beta' ]; then
              echo "Beta build of ${{ steps.version.outputs.base }}, from"
              echo '`${{ github.sha }}`.'
              echo
            fi
            echo "$changes"
            echo
            echo "Signing certificate (SHA-256): \`${{ steps.signature.outputs.fingerprint }}\`"
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.channel.outputs.label }} ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.prerelease == 'false' }}
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.checksum }}
