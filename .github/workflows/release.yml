name: Release

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if this version was released already'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the channel
        id: channel
        run: |
          set -euo pipefail
          if [ '${{ github.ref_name }}' = 'dev' ]; then
            {
              echo "name=beta"
              echo "variant=Beta"
              echo "dir=beta"
              echo "label=Pie Launcher Beta"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "name=stable"
              echo "variant=Release"
              echo "dir=release"
              echo "label=Pie Launcher"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          upstream=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          upstream_code=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$upstream" ] || [ -z "$upstream_code" ]; then
            echo "::error::Could not read the version from app/build.gradle"
            exit 1
          fi
          fork=$(tr -cd '0-9' < fork-version 2>/dev/null || true)
          [ -n "$fork" ] || fork=0
          if [ "$fork" -ge 1000 ]; then
            echo "::error::fork-version must stay below 1000"
            exit 1
          fi
          if [ '${{ steps.channel.outputs.name }}' = 'beta' ]; then
            # A beta leads to the next release, so it must not carry the
            # version of one that is already out.
            if git rev-parse -q --verify "refs/tags/v$upstream.$fork" \
                >/dev/null; then
              fork=$((fork + 1))
            fi
            base="$upstream.$fork"
            name="$base-beta.${{ github.run_number }}"
            code=${{ github.run_number }}
            # No run number, so every push updates the same draft
            # instead of leaving a release per feature behind.
            tag="v$base-beta"
          else
            base="$upstream.$fork"
            name="$base"
            code=$((upstream_code * 1000 + fork))
            tag="v$name"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building ${{ steps.channel.outputs.name }} $name (code $code)"

      - name: Decide whether to publish
        id: check
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          if [ '${{ github.event.inputs.force }}' = 'true' ]; then
            echo "Forced run, publishing $tag regardless of its current state."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag exists already, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signing secrets are configured
        if: steps.check.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value=${!secret}
            [ -n "$value" ] || missing="$missing $secret"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing - see docs/RELEASING.md"
            exit 1
          fi

      - name: Set up JDK 21
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.check.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: steps.check.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"

      - name: Build APK
        if: steps.check.outputs.publish == 'true'
        env:
          ANDROID_KEYFILE: ${{ runner.temp }}/signing/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon lintDebug assemble${{ steps.channel.outputs.variant }}

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Collect artifacts
        if: steps.check.outputs.publish == 'true'
        id: artifacts
        run: |
          set -euo pipefail
          dir='app/build/outputs/apk/${{ steps.channel.outputs.dir }}'
          apk=$(find "$dir" -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No APK was built in $dir"
            exit 1
          fi
          mkdir -p dist
          if [ '${{ steps.channel.outputs.name }}' = 'beta' ]; then
            name="PieLauncher-Beta-${{ steps.version.outputs.tag }}.apk"
          else
            name="PieLauncher-${{ steps.version.outputs.tag }}.apk"
          fi
          cp "$apk" "dist/$name"
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          echo "apk=dist/$name" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$name.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        if: steps.check.outputs.publish == 'true'
        id: signature
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs --verbose '${{ steps.artifacts.outputs.apk }}'
          fingerprint=$("$apksigner" verify --print-certs '${{ steps.artifacts.outputs.apk }}' |
            sed -n 's/.*SHA-256 digest: *//p' | head -n 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Assemble release notes
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if [ '${{ steps.channel.outputs.name }}' = 'beta' ]; then
            # The stable tag sits on a merge commit this branch does not
            # contain, so ask the default branch instead of describing.
            git fetch --no-tags origin \
              '${{ github.event.repository.default_branch }}' \
              >/dev/null 2>&1 || true
            since=$(git rev-parse -q --verify FETCH_HEAD || true)
          else
            since=$(git describe --tags --abbrev=0 --exclude '*-beta*' \
                2>/dev/null || true)
          fi
          stable=$(git describe --tags --abbrev=0 --exclude '*-beta*' \
              ${since:-HEAD} 2>/dev/null || true)
          if [ -n "$since" ]; then
            changes=$(git log --no-merges --format='* %s' "$since"..HEAD)
          else
            changes=$(git log --no-merges --format='* %s' -n 20)
          fi
          [ -n "$changes" ] || changes="Nothing yet."
          {
            if [ '${{ steps.channel.outputs.name }}' = 'beta' ]; then
              echo "Beta ${{ github.run_number }} on the way to"
              echo "${{ steps.version.outputs.base }}, built from"
              echo '`${{ github.sha }}`.'
              echo
              echo "Everything it adds to stable ${stable:-(none yet)}:"
              echo
            fi
            if [ '${{ steps.channel.outputs.name }}' != 'beta' ]; then
              echo "Changes since ${stable:-the first release}:"
              echo
            fi
            echo "$changes"
            echo
            echo "Signing certificate (SHA-256): \`${{ steps.signature.outputs.fingerprint }}\`"
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.channel.outputs.label }} ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.prerelease == 'false' }}
          draft: true
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.checksum }}

      - name: Prune older betas
        if: steps.check.outputs.publish == 'true' && steps.channel.outputs.name == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '1'
        run: |
          set -euo pipefail
          gh release list --limit 100 \
            --json tagName,isPrerelease,isDraft,createdAt \
            --jq 'map(select(.isPrerelease and (.isDraft | not)))
              | sort_by(.createdAt) | reverse | .[].tagName' > betas.txt
          tail -n +$((KEEP + 1)) betas.txt | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
